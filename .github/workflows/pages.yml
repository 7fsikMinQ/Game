# 푸시되면 테스트 후 GitHub Pages로 배포한다. (설정: Settings > Pages > Source = GitHub Actions)
# 이 저장소의 기본(default) 브랜치는 main 이 아니라 claude/serene-franklin-tpdu4g 라서 둘 다 적어 둔다.
# manifest.webmanifest가 있는 폴더를 "게임"으로 보고 자동으로 포함한다. test/ 폴더는 뺀다.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main, claude/serene-franklin-tpdu4g]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: node tools/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
